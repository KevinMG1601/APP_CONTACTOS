<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Frutas (Dexie / offline)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p class="text-sm text-slate-600 dark:text-slate-300 mb-4 ion-text-wrap">
    Datos locales en el dispositivo; funciona sin conexión.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3 mb-6">
    <ion-item>
      <ion-input label="Nombre" labelPlacement="stacked" formControlName="name" autocomplete="off"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Color" labelPlacement="stacked" formControlName="color"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Precio" labelPlacement="stacked" type="number" formControlName="price"></ion-input>
    </ion-item>
    <ion-button expand="block" type="submit" [disabled]="form.invalid">Agregar fruta</ion-button>
  </form>

  <ion-searchbar placeholder="Buscar por nombre" debounce="200" (ionInput)="onSearch($event)"></ion-searchbar>

  <ion-list>
    @for (f of filteredFruits$ | async; track trackById($index, f)) {
      <ion-item>
        <ion-label>
          <h2>{{ f.name }}</h2>
          <p>{{ f.color }} · ${{ f.price | number : '1.2-2' }}</p>
        </ion-label>
        <ion-button fill="clear" color="danger" size="small" (click)="remove(f)">Eliminar</ion-button>
      </ion-item>
    } @empty {
      <ion-item lines="none">
        <ion-label>No hay frutas que coincidan.</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
