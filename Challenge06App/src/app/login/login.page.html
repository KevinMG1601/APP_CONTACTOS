<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Challenge06App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="max-w-md mx-auto pt-6">
    <h1 class="text-2xl font-semibold text-center mb-6 text-slate-800 dark:text-slate-100">Acceso</h1>

    <form [formGroup]="form" (ngSubmit)="login()">
      <ion-list class="rounded-xl overflow-hidden shadow-sm" lines="full">
        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            formControlName="email"
            autocomplete="email"
            inputmode="email"
          ></ion-input>
        </ion-item>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <ion-item lines="none">
            <ion-text color="danger" class="text-sm">Introduce un email válido</ion-text>
          </ion-item>
        }
        <ion-item>
          <ion-input
            label="Contraseña"
            labelPlacement="stacked"
            type="password"
            formControlName="password"
            autocomplete="current-password"
          ></ion-input>
        </ion-item>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <ion-item lines="none">
            <ion-text color="danger" class="text-sm">Mínimo 6 caracteres</ion-text>
          </ion-item>
        }
      </ion-list>

      <div class="flex flex-col gap-3 mt-6">
        <ion-button expand="block" type="submit" [disabled]="submitting">Entrar</ion-button>
        <ion-button expand="block" fill="outline" type="button" (click)="register()" [disabled]="submitting">
          Registrarse
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
