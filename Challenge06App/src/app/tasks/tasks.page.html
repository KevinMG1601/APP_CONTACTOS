<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tareas (Realtime DB)</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="add()">
        <ion-icon slot="icon-only" name="add-outline" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if ((online$ | async) === false) {
    <ion-toolbar color="warning" class="ion-text-center">
      <ion-text class="ion-padding text-sm font-medium">
        Sin conexión — Contacts y Tasks limitados: las ediciones van a cola local
      </ion-text>
    </ion-toolbar>
  }

  <ion-list>
    @for (t of tasks$ | async; track trackById($index, t)) {
      <ion-item>
        <ion-checkbox
          slot="start"
          [checked]="t.completed"
          (ionChange)="toggle(t, $event.detail.checked)"
          aria-label="Completada"
        ></ion-checkbox>
        <ion-label>
          <h2 [class.line-through]="t.completed">{{ t.title }}</h2>
        </ion-label>
        <ion-button fill="clear" color="danger" size="small" (click)="remove(t)">Eliminar</ion-button>
      </ion-item>
    } @empty {
      <ion-item lines="none">
        <ion-label class="ion-text-wrap text-slate-500">No hay tareas. Añade una con +.</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
